<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>DISCO</title>

	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<div class="chat-window">

		<!-- HEADER -->
		<div class="header">

			<div class="room-name" id="roomName">
				-- ROOM --
			</div>

			<div class="token-display">
				TOKENS: <span id="tokenBalance">0</span>
			</div>

			<button id="changeRoomBtn" class="new-id-btn">ROOM</button>

			<button id="newIdBtn" class="new-id-btn" hidden>NEW ID</button>

		</div>

		<!-- CHAT -->
		<div class="chat-log" id="messages"></div>

		<!-- INPUT -->
		<div class="input-bar">

			<div class="prompt">&gt;</div>

			<input
				id="messageInput"
				type="text"
				placeholder="Type message..."
				autocomplete="off"
			>

		</div>

	</div>

	<!-- Firebase (must load before script.js) -->
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

	<script src="script.js"></script>

</body>
</html>
