
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DISCO</title>

    <!-- Disco styling -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Main chat window -->
    <div class="chat-window">

        <!-- Header: room, tokens and controls -->
        <div class="header">

            <!-- Current room name -->
            <div class="room-name" id="roomName">
                -- ROOM --
            </div>

            <!-- Starting token display -->
            <div class="token-display">
                TOKENS: <span id="tokenBalance">200</span>
            </div>

            <!-- Change room button -->
            <button id="changeRoomBtn" class="new-id-btn">ROOM</button>

            <!-- Generate a new user ID -->
            <button id="newIdBtn" class="new-id-btn" hidden>NEW ID</button>

        </div>

        <!-- Chat message history -->
        <div class="chat-log" id="messages"></div>

        <!-- Message input area -->
        <div class="input-bar">

            <!-- Terminal-style prompt -->
            <div class="prompt">&gt;</div>

            <!-- User message field -->
            <input
                id="messageInput"
                type="text"
                placeholder="Type message..."
                autocomplete="off"
            >

        </div>

    </div>

    <!-- Firebase SDK: load before the application -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- Disco application logic -->
    <script src="script.js"></script>
<script>
const hud = document.querySelector(".hud");

hud.addEventListener("mousemove", (event) => {
  const rect = hud.getBoundingClientRect();

  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  hud.style.setProperty("--mouse-x", `${x}px`);
  hud.style.setProperty("--mouse-y", `${y}px`);
});

hud.addEventListener("mouseleave", () => {
  hud.style.setProperty("--mouse-x", "50%");
  hud.style.setProperty("--mouse-y", "50%");
});
</script>
</body>
</html>
